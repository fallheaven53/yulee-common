[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yulee-common"
version = "0.4.0"
description = "율이공방 공통 GCP/Sheets/Secrets/Theme 유틸 (Streamlit + Tkinter)"
requires-python = ">=3.10"
dependencies = [
    "gspread>=5.10,<7",
    "google-auth>=2.20,<3",
    "streamlit>=1.30,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["yulee_common*"]

[tool.setuptools.package-data]
"yulee_common.theme" = ["assets/*.css", "assets/*.template"]
"yulee_common.styles" = ["*.css", "fonts/*.woff2", "fonts/*.txt"]
"yulee_common.streamlit" = ["*.template"]
