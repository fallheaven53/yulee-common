[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yulee-common"
version = "0.1.0"
description = "율이공방 공통 GCP/Sheets/Secrets 유틸"
requires-python = ">=3.10"
dependencies = [
    "gspread>=5.10,<7",
    "google-auth>=2.20,<3",
    "streamlit>=1.30,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["yulee_common*"]
